[package]
name = "datamunge-rust-examples"
version = "0.0.1"
edition = "2021"
publish = false
autoexamples = false

# The examples examples/rust/<name>.rs (just TARGET=<name> run-rust runs one: cargo run --example),
# built against the Rosetta-generated crate (just prebuild-rust); it links libdatamunge_rust from
# DATAMUNGE_RUST_LIB_DIR (just build-rust installs it into build/rust/prefix/lib).
[lib]
path = "lib.rs"

[dependencies]
datamunge = { path = "../../src/datamungerust/datamunge" }

[[example]]
name = "autodiff_ex"
path = "autodiff_ex.rs"

