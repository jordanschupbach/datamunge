; Set the memory limit
; memory_limit = 128M

; Enable output buffering
; output_buffering = On

; Set the session save path
; session.save_path = "/tmp"

; Enable specific extensions (the datamunge PHP binding needs none: it uses FFI)

; Time zone setting
; date.timezone = "America/Denver"

; Error reporting
; error_reporting = E_ALL
; display_errors = Off
; log_errors = On
